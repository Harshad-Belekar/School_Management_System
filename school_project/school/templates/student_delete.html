{% extends 'base.html' %}

{% block title %}Delete Student | School IMS{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-body p-5 text-center">

                    <div style="
                        width:70px;
                        height:70px;
                        margin:0 auto 20px;
                        border-radius:50%;
                        background:#fff1f1;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:32px;
                    ">
                        🗑️
                    </div>


                    <h2 class="fw-bold text-dark mb-3">
                        Confirm Delete
                    </h2>


                    <p class="text-muted mb-4">

                        Are you sure you want to delete

                        <strong class="text-danger">
                            {{ student.name }}
                        </strong>

                        ?

                        <br>

                        <small>
                            This action cannot be undone.
                        </small>

                    </p>


                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger px-4 me-2"
                        >
                            🗑️ Yes, Delete
                        </button>


                        <a
                            href="{% url 'students' %}"
                            class="btn btn-secondary px-4"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
