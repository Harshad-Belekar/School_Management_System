{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | School IMS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Constantia, Georgia, "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background: #f4f7fb;
        }

        .login-card {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(23,43,77,0.15);

            text-align: center;

            border: 1px solid #e5eaf0;
        }

        .login-logo {

            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fff3df;

            font-size: 32px;
        }

        .login-card h2 {

            color: #172b4d;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .login-card p {

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .form-group {

            text-align: left;

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            color: #172b4d;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .form-control {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d8dee8;

            border-radius: 8px;

            outline: none;

            font-size: 15px;
        }

        .form-control:focus {

            border-color: #ff9800;

            box-shadow:
                0 0 0 3px rgba(255,152,0,.12);
        }

        .login-btn {

            width: 100%;

            padding: 12px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #ff8a00;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {

            background: #f07800;
        }

        .error-message {

            background: #fdecec;

            color: #b42318;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: bold;
        }

        .back-home {

            display: inline-block;

            margin-top: 20px;

            color: #172b4d;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }

        .back-home:hover {

            color: #ff7900;
        }

        @media (max-width: 500px) {

            .login-card {
                width: 100%;
                padding: 30px 22px;
            }

        }

    </style>

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <div class="login-logo">
            👨‍💼
        </div>


        <h2>
            Admin Login
        </h2>


        <p>
            Login to manage your School IMS
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="error-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>


        <a
            href="{% url 'home' %}"
            class="back-home">

            ← Back to Home

        </a>


    </div>


</div>


</body>

</html>
